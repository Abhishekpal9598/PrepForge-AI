services:
  - type: web
    name: prepforge-ai-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm --workspace=server run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_NAME
        value: prepforge_prod
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: STORAGE_TYPE
        value: local
